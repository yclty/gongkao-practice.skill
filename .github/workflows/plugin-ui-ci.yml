name: gongkao-local-ci

on:
  push:
    paths: ["plugin-ui/**", "plugins/**", "plugin-package/**", "packaging/**", "scripts/**", "tests/**", "references/**", ".github/workflows/plugin-ui-ci.yml"]
  pull_request:
    paths: ["plugin-ui/**", "plugins/**", "plugin-package/**", "packaging/**", "scripts/**", "tests/**", "references/**", ".github/workflows/plugin-ui-ci.yml"]

jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        working-directory: plugin-ui
        run: npm ci --ignore-scripts
      - name: Runtime and integration tests
        working-directory: plugin-ui
        run: npm test
      - name: Importer quality regression
        run: python -m unittest discover -s tests -p "test_import*.py"
      - name: Portable source synchronization
        run: |
          python scripts/sync_local_plugin.py
          git diff --exit-code -- plugins/gongkao-coach/references plugins/gongkao-coach/PRIVACY.md plugin-package/gongkao-coach/skills
      - name: Package contracts and JavaScript syntax
        run: node scripts/check_local_source.mjs
